name: Server Check (read-only)

# 用途：诊断并体检生产服务器。所有远程操作都在 scripts/remote-check.sh 里，
# 该文件只做读取与展示，不修改服务器任何状态。
# 通过 ssh 'bash -s' 从标准输入喂给服务器执行，避免在 YAML 里嵌套引号。

on:
  workflow_dispatch:
    inputs:
      script:
        description: "要执行的脚本（必须位于 scripts/ 目录）"
        required: false
        default: "scripts/remote-check.sh"
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      SCRIPT: ${{ inputs.script }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验脚本路径白名单
        run: |
          set -eu
          case "$SCRIPT" in
            scripts/*.sh) ;;
            *) echo "拒绝执行：只允许 scripts/ 目录下的 .sh 文件"; exit 1 ;;
          esac
          case "$SCRIPT" in
            *..*|*/*/*) echo "拒绝执行：路径不允许跨目录"; exit 1 ;;
          esac
          test -f "$SCRIPT"
          echo "将执行: $SCRIPT"

      - name: 0) 校验 secrets 是否齐全
        run: |
          set -eu
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY; do
            if [ -z "$(eval "echo \$$v")" ]; then echo "缺少 secret: $v"; missing=1; fi
          done
          echo "各 secret 字符长度 — HOST=${#DEPLOY_HOST} USER=${#DEPLOY_USER} KEY=${#DEPLOY_KEY}"
          exit $missing

      - name: 1) 网络层 — TCP 能否到达 22 端口
        run: |
          set -u
          echo "目标: $DEPLOY_HOST:22"
          if timeout 20 bash -c "exec 3<>/dev/tcp/$DEPLOY_HOST/22" 2>/dev/null; then
            echo "TCP 连接: OK"
          else
            echo "TCP 连接: 失败"
          fi

      - name: 2) 服务器主机密钥指纹
        run: |
          set -u
          if timeout 30 ssh-keyscan -T 20 -p 22 "$DEPLOY_HOST" > /tmp/hostkeys 2>/dev/null && [ -s /tmp/hostkeys ]; then
            ssh-keygen -lf /tmp/hostkeys
          else
            echo "keyscan 失败：runner 到服务器 22 端口不通"
          fi

      - name: 3) 登录并在服务器跑只读体检
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/probe_key
          chmod 600 ~/.ssh/probe_key
          echo "--- 使用的私钥指纹 ---"
          ssh-keygen -lf ~/.ssh/probe_key 2>&1 || echo "私钥解析失败"
          echo
          set +e
          ssh -i ~/.ssh/probe_key \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/known_hosts \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              -p 22 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < "$SCRIPT"
          rc=$?
          set -e
          echo
          echo "ssh 退出码: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "!! 远程体检未完成。若第 1、2 步成功说明网络通，问题在密钥认证。"
          fi
