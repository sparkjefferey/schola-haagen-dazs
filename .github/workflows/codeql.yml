name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 04:27 UTC 自动跑一次（随机分钟避免整点拥堵）
    - cron: "27 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # 固定完整 SHA（对应 actions/checkout v4）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        # 固定完整 SHA（对应 github/codeql-action v3）
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324
