name: Manual Deploy (clean server only)

# 2026-08-15 事件响应：旧服务器 root 权限已确认失陷。
# 禁止 push 自动触发，避免 GitHub 再向不可信主机发起 SSH 连接。
# 只有新服务器已经重装、密钥全部轮换后，才可手动输入 REBUILT 运行。
on:
  workflow_dispatch:
    inputs:
      clean_target_confirmation:
        description: "确认目标已用官方镜像重装且全部密钥已轮换：输入 REBUILT"
        required: true
        type: string

jobs:
  deploy:
    if: ${{ inputs.clean_target_confirmation == 'REBUILT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: 拒绝 root 部署与缺失配置
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.DEPLOY_FINGERPRINT }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_FINGERPRINT"
          # 注：本行「禁止 root 部署」与项目档案中「放开 root」的既定计划相冲突。
          # 该冲突牵涉 2026-08-15 事件响应的策略取向（本文件头部即为此而设），
          # 属项目所有者的决定，改动前请先确认要哪一边。
          test "$DEPLOY_USER" != "root"

      - name: 通过 SSH 登录服务器并部署
        # 固定到完整 commit SHA（对应 v1.0.3），避免第三方 Action 被篡改后自动拉取恶意版本
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          port: 22
          script_stop: true
          script: |
            # 服务器上的项目目录是 /opt/schola-haagen-dazs（由 remote-check.sh /
            # remote-deploy.sh 与历次部署日志确认）。此处原写 /srv/schola-haagen-dazs，
            # 该目录并不存在——若本 workflow 真的跑起来会立刻在此失败。
            cd /opt/schola-haagen-dazs
            backup_dir="$PWD/backups"
            mkdir -p "$backup_dir"
            backup_stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_file="$backup_dir/schola-data-predeploy-$backup_stamp.sqlite"
            backup_tmp="$(mktemp "$backup_dir/.schola-data-predeploy.XXXXXX")"
            if ! docker compose ps --status running -q schola | grep -q .; then
              rm -f "$backup_tmp"
              echo "schola 容器未运行，无法确认数据库备份；停止部署。"
              exit 1
            fi
            if ! docker compose exec -T schola node -e '
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const Database = require("better-sqlite3");
            const source = new Database("/app/data/schola.db", { readonly: true, fileMustExist: true });
            const target = path.join(os.tmpdir(), `schola-${crypto.randomUUID()}.sqlite`);
            (async () => {
              try {
                await source.backup(target);
                source.close();
                const snapshot = fs.readFileSync(target);
                fs.rmSync(target, { force: true });
                process.stdout.write(snapshot);
              } catch (error) {
                try { source.close(); } catch {}
                fs.rmSync(target, { force: true });
                console.error(error instanceof Error ? error.message : String(error));
                process.exitCode = 1;
              }
            })();
            ' > "$backup_tmp"; then
              rm -f "$backup_tmp"
              echo "数据库在线备份失败；停止部署。"
              exit 1
            fi
            test -s "$backup_tmp"
            mv "$backup_tmp" "$backup_file"
            echo "部署前数据库备份完成：$backup_file"
            git fetch origin
            git reset --hard origin/main
            bash update.sh
