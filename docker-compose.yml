services:
  schola:
    build: .
    container_name: schola-haagen-dazs
    restart: unless-stopped   # 进程挂了/服务器重启，docker 自动拉起，基本免维护
    # 安全加固：只绑本地回环 127.0.0.1，明文直连 IP:3000 不再对外暴露。
    # 外部访问只走 Cloudflare Tunnel（cloudflared 装在同机，连本机 127.0.0.1:3000）。
    # ⚠️ 若需本机临时直连调试，把下面改回 "3000:3000" 再 `docker compose up -d`，调完改回。
    ports:
      - "127.0.0.1:3000:3000"
    # 以容器内非 root 的 node 用户(uid 1000)运行，降低应用层 RCE 拿到容器 root 的风险。
    # 配套：Dockerfile 已把 /app 归属 node，schola-data 卷初始化即 node 可写。
    user: "node"
    environment:
      - NODE_ENV=production
      # 首任与后续管理员都可用此邀请码注册。首任建立后应清空它并重启。
      - ADMIN_INVITE=${ADMIN_INVITE:-}
      - PM_DAILY_LIMIT=${PM_DAILY_LIMIT:-5}
      - SCHOLAR_CLIENT_RATE_LIMIT=${SCHOLAR_CLIENT_RATE_LIMIT:-20}
      - COOL_DOWN_HOURS=${COOL_DOWN_HOURS:-24}
      # 论文附件上传限制（可选；格式白名单见 lib/attachment-formats.ts，文件存 schola-data 卷）
      - ATTACHMENT_MAX_MB=${ATTACHMENT_MAX_MB:-20}
      - ATTACHMENT_TOTAL_MB=${ATTACHMENT_TOTAL_MB:-50}
      - ATTACHMENT_MAX_COUNT=${ATTACHMENT_MAX_COUNT:-10}
      # CORE 学术源免费密钥（可选）：去 https://core.ac.uk/services/api 免费注册，
      # 拿到 key 后填到同目录 .env 文件的 SCHOLAR_CORE_KEY=你的key，再 `docker compose up -d` 即可启用中文开放论文检索。
      - SCHOLAR_CORE_KEY=${SCHOLAR_CORE_KEY:-}
      # 系统邮件（SMTP，可选）：未配置时弱口令提醒仅走站内系统消息，不报错。
      # 用 Resend 时：SMTP_HOST=smtp.resend.com SMTP_PORT=587 SMTP_USER=resend SMTP_PASS=你的APIKey
      # 填好后在同目录 .env 写入这些变量，再 `docker compose up -d` 即可启用真·邮件。
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # 学正（AI 点评，可选）：填了 AI_API_KEY 才在论坛启用「@学正」召唤；留空则整块功能隐藏，不报错。
      # 默认接 DeepSeek 的 OpenAI 兼容接口（取 key：https://platform.deepseek.com → API keys）；
      # 换国内别家或自建网关，只改 AI_BASE_URL 与 AI_MODEL 即可（任何 OpenAI 兼容端点皆可）。
      # AI_DAILY_GLOBAL 是防刷爆账单的硬闸：全站每日调用总次数，超了自动停。
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_MODEL=${AI_MODEL:-deepseek-flash}
      - AI_DAILY_PER_USER=${AI_DAILY_PER_USER:-3}
      - AI_DAILY_GLOBAL=${AI_DAILY_GLOBAL:-50}
      - AI_MAX_CONCURRENT=${AI_MAX_CONCURRENT:-2}
      # 单次回答的输出上限（token）：必须给「思考」留余量——思考也计入 max_tokens，
      # 太小会让模型思考完就没额度写正文（表现为「模型服务暂时不可用」）。
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-6000}
      # 思考强度：none 直接作答（实测快 4~5 倍、用量降到约 1/4）；留空=服务商默认（思考全开）
      - AI_REASONING_EFFORT=${AI_REASONING_EFFORT:-none}
      - AI_MAX_INPUT_CHARS=${AI_MAX_INPUT_CHARS:-12000}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-60000}
    volumes:
      - schola-data:/app/data   # 数据库持久化：容器重建/更新，论文与账号数据不丢

volumes:
  schola-data:
